<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | APEX F1</title>

    <link rel="stylesheet" href="cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="painel-marca">

    <div class="logo">
        <span class="logo-texto">APEX</span>
        <span class="logo-badge">F1</span>
    </div>

    <div class="headline">
        <h2>Entre no grid do APEX F1.</h2>
        <p>Time, pilotos, lendas e um quiz para testar o que você sabe sobre a 
            a F1 e sobre o Ayrton Senna.
        </p>
    </div>

    <div class="citacao">
        <div class="checker"></div>
        <blockquote>"Ou você faz uma coisa bem-feita ou não faz."</blockquote>
        <cite>Ayrton Senna</cite>
    </div>
    </aside>
    <main class="painel-formulario">
        <form class="formulario" id="form_cadastro">
            <header class="cabecalho">
                <h1>Criar conta</h1>
                <p>Cadastre-se para acessar o conteúdo do APEX F1.</p>
            </header>
        </form>
    </main>
</body>
</html>
<!-- 'aside': tag semântica para um bloco lateral, que complementa o conteúdo principal; 
 cada bloco, vira uma div!;
 'checker' é a bandeira quadriculada. Fica vazio no HTML, porque vai ser desenhado só com CSS;
 'blockquote' é para citações;
 'cite' é para o nome do autor;-->
